name: Build and Push to ghcr.io
run-name: Build and Push to ghcr.io

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # print the tagged version's section: from its "## [x.y.z]" heading
          # to the next "## [" heading (an [Unreleased] section is skipped)
          awk -v v="$ver" 'index($0, "## ["v"]") == 1 {p = 1; print; next} p && /^## \[/ {exit} p {print}' CHANGELOG.md > release-notes.md
          # the tagged version must have a CHANGELOG.md section; anything
          # else would publish another version's notes under this tag
          head -n 1 release-notes.md | grep -q "^## \[$ver\]" \
            || { echo "::error::CHANGELOG.md has no [$ver] section"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
